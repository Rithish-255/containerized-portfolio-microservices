worker_processes  1;
events { worker_connections 1024; }

http {
  sendfile on;
  upstream node_backend {
    server node:3000;
  }
  upstream flask_backend {
    server flask:5000;
  }

  server {
    listen 80;

    location /api/ {
      proxy_pass http://flask_backend/;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
    }

    location / {
      proxy_pass http://node_backend/;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
    }
  }
}
