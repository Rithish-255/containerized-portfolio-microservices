<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Portfolio (Microservices)</title>
    <style>
      body { font-family: Arial, sans-serif; margin: 2rem; }
      h1 { color: #2c3e50; }
      .project { margin-bottom: 1rem; }
    </style>
  </head>
  <body>
    <h1>Portfolio (Microservices)</h1>
    <div id="projects">Loading projects...</div>

    <script>
      async function load() {
        try {
          const res = await fetch('/api/projects');
          const data = await res.json();
          const container = document.getElementById('projects');
          container.innerHTML = '';
          data.forEach(p => {
            const div = document.createElement('div');
            div.className = 'project';
            div.innerHTML = `<strong>${p.title}</strong><div>${p.description}</div>`;
            container.appendChild(div);
          });
        } catch (err) {
          document.getElementById('projects').textContent = 'Failed to load projects.';
        }
      }
      load();
    </script>
  </body>
</html>
