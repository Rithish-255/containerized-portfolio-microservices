version: "3.8"
services:
  flask:
    build: ./services/flask_api
    container_name: flask-api
    restart: unless-stopped

  node:
    build: ./services/node_frontend
    container_name: node-frontend
    restart: unless-stopped

  nginx:
    build: ./nginx
    container_name: nginx-proxy
    ports:
      - "8080:80"
    depends_on:
      - node
      - flask
